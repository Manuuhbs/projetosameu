  <body class="pagina-principal">
    <section class="pagina-principal">
      <div class="container">
        <h1 class="titulo">10 coisas que eu amo em você</h1>
        <div class="botoes">
          <div class="botoes-coluna-esquerda">
            <button type="button" id="btn-um" class="btn-clicar" data-original="..." data-texto="Seus olhos: Você sorri com um olhar e é capaz de iluminar um ambiente inteiro com isso">...</button>
            <button type="button" id="btn-dois" class="btn-clicar" data-original="..." data-texto="Seu sorriso: Quando você sorri, parece uma criancinha feliz, o coração chega a ficar quentinho">...</button>
            <button type="button" id="btn-tres" class="btn-clicar" data-original="..." data-texto="Sua risada: Queria fazer você rir o dia inteiro, só para ouvir essa risada gostosa que cura tudo">...</button>
            <button type="button" id="btn-quatro" class="btn-clicar" data-original="..." data-texto="Seu cabelo: É um charme a cor do seu cabelo, ainda mais esses cachinhos e ondas lindinhas, que dá vontade de não soltar nunca">...</button>
            <button type="button" id="btn-cinco" class="btn-clicar" data-original="..." data-texto="Seu humor: Amo poder contar com você em qualquer dia, seja bom ou ruim, pois você vai dar um jeito de me fazer rir e esquecer de todos os meus problemas">...</button>
          </div>
          <div class="botoes-coluna-direita">
          <button type="button" id="btn-seis" class="btn-clicar" data-original="..." data-texto="Sua altura/tamanho: É tão bom o fato de você ser grande, dá uma conchinha gostosa heheh">...</button>
            <button type="button" id="btn-sete" class="btn-clicar" data-original="..." data-texto="Sua inteligência: Adoro ouvir você falando algo em que você sabe muito com um brilho no olhar">...</button>
            <button type="button" id="btn-oito" class="btn-clicar" data-original="..." data-texto="Sua dedicação: Amo como você se dedica muito em quando quer algo ou que algo dê certo, estarei sempre torcendo por você em todas as suas conquistas, sejam pequenas ou grandes">...</button>
            <button type="button" id="btn-nove" class="btn-clicar" data-original="..." data-texto="Sua voz: Acalma tudo que é inquietante dentro de mim, é como sol em um dia nublado">...</button>
            <button type="button" id="btn-dez" class="btn-clicar" data-original="..." data-texto="Seu toque: O quanto você é carinhoso e cuidadoso é admiravel, amo seu toque, delicado e macio">...</button>
          </div>
        </div>
        <div class="botao-secret">
          <button type="button" id="botao-secreto" style="display: none">clique aqui!</button>
        </div>
      </div>
